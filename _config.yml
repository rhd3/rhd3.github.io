# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: rhd3's blog!
description: I want to go home...
repository: https://github.com/rhd3/rhd3.github.io/
baseurl: # the subpath of your site, e.g. /blog
url: https://rhd3.github.io  # the base hostname & protocol for your site

# Build settings
markdown: redcarpet
redcarpet:
  extensions: ["autolink", "no_intra_emphasis", "tables", "fenced_code_blocks"]

  
# Sass settings
sass:
  style: compressed

# Theme settings
theme_mode: markdown  # choices are: 'dark', 'standard', 'markdown'

# Customizations
your_name: rhd3
email: krud03@naver.com

navigation:
  - text: Home
    url: /
  - text: Posts
    url: /posts


projects:
  - name: 
    description:
    link: 
    image:


social:
  - service: github
    username: rhd3
    link: https://github.com/rhd3


# Plugins
gems:
  - jekyll-seo-tag
